<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Web App Meta -->
    <title>PG Ease</title>
    <meta name="description" content="Manage your PG stay, pay rent, raise maintenance complaints, and discover top verified PGs across India." />
    <meta name="theme-color" content="#008080" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PG Ease" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Favicon -->
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="apple-touch-icon" href="/favicon.png?v=5" />
    <link rel="icon" type="image/png" href="/favicon.png?v=5" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" />
    
    <!-- Fonts: Outfit from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pgease_theme') || localStorage.getItem('theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] font-outfit text-brandText antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
