<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle / Glow -->
  <circle cx="200" cy="160" r="130" fill="#E6F3F3" />

  <!-- Center Card Stack: Requests -->
  <g filter="drop-shadow(0px 12px 24px rgba(0,0,0,0.1))">
    <rect x="85" y="55" width="230" height="195" rx="18" fill="#FFFFFF" />
    
    <!-- Header -->
    <text x="105" y="80" font-family="sans-serif" font-weight="800" font-size="12" fill="#1F2937">Instant Resident Passes</text>
    <circle cx="295" cy="76" r="6" fill="#008080" />

    <!-- Pass 1: Night Out -->
    <rect x="100" y="95" width="200" height="38" rx="8" fill="#E6F3F3" />
    <circle cx="118" cy="114" r="9" fill="#008080" />
    <text x="118" y="117" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">🌙</text>
    <text x="135" y="110" font-family="sans-serif" font-weight="700" font-size="9" fill="#1F2937">Night Out Pass</text>
    <text x="135" y="122" font-family="sans-serif" font-size="7" fill="#008080">Approved by Owner ✓</text>

    <!-- Pass 2: Guest Pass -->
    <rect x="100" y="142" width="200" height="38" rx="8" fill="#FEF3C7" />
    <circle cx="118" cy="161" r="9" fill="#F59E0B" />
    <text x="118" y="165" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">👤</text>
    <text x="135" y="157" font-family="sans-serif" font-weight="700" font-size="9" fill="#1F2937">Guest Pass (Mom Visit)</text>
    <text x="135" y="169" font-family="sans-serif" font-size="7" fill="#D97706">Entry Code Generated</text>

    <!-- Pass 3: Quick Maintenance -->
    <rect x="100" y="189" width="200" height="38" rx="8" fill="#F3F4F6" />
    <circle cx="118" cy="208" r="9" fill="#10B981" />
    <text x="118" y="212" font-family="sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">🔧</text>
    <text x="135" y="204" font-family="sans-serif" font-weight="700" font-size="9" fill="#1F2937">Room AC Serviced</text>
    <text x="135" y="216" font-family="sans-serif" font-size="7" fill="#059669">Resolved within 2 hrs</text>
  </g>
</svg>