<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle / Glow -->
  <circle cx="200" cy="160" r="130" fill="#E6F3F3" />

  <!-- Resident Phone Frame -->
  <rect x="130" y="50" width="140" height="215" rx="22" fill="#1F2937" stroke="#374151" stroke-width="3"/>
  <rect x="139" y="62" width="122" height="190" rx="14" fill="#FFFFFF" />

  <!-- Resident Top Badge -->
  <rect x="150" y="75" width="100" height="36" rx="10" fill="#008080" />
  <text x="200" y="90" font-family="sans-serif" font-weight="700" font-size="9" fill="#E6F3F3" text-anchor="middle">PG EASE RESIDENT</text>
  <text x="200" y="103" font-family="sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">Room 302 • Bed A</text>

  <!-- Food Menu Widget -->
  <rect x="150" y="120" width="100" height="42" rx="8" fill="#E6F3F3" />
  <circle cx="166" cy="141" r="9" fill="#FFD166" />
  <text x="166" y="145" font-family="sans-serif" font-size="10" text-anchor="middle">🍲</text>
  <text x="182" y="137" font-family="sans-serif" font-weight="700" font-size="9" fill="#1F2937">Dinner Menu</text>
  <text x="182" y="149" font-family="sans-serif" font-size="8" fill="#008080">Paneer & Roti 7:30</text>

  <!-- Wi-Fi & Notice Widget -->
  <rect x="150" y="170" width="100" height="34" rx="8" fill="#F3F4F6" />
  <text x="162" y="186" font-family="sans-serif" font-size="9">📡</text>
  <text x="178" y="185" font-family="sans-serif" font-weight="700" font-size="8" fill="#1F2937">Hi-Speed Wi-Fi</text>
  <text x="178" y="196" font-family="sans-serif" font-size="7" fill="#6B7280">Password in app</text>

  <!-- Floating Pocket Tag Left -->
  <g filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.12))">
    <rect x="35" y="115" width="85" height="52" rx="12" fill="#FFFFFF" />
    <circle cx="55" cy="141" r="10" fill="#E6F3F3" />
    <text x="55" y="145" font-family="sans-serif" font-size="11" text-anchor="middle">🔑</text>
    <text x="72" y="137" font-family="sans-serif" font-weight="700" font-size="9" fill="#1F2937">Smart</text>
    <text x="72" y="149" font-family="sans-serif" font-weight="700" font-size="9" fill="#008080">Access</text>
  </g>

  <!-- Floating Notification Right -->
  <g filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.12))">
    <rect x="280" y="145" width="85" height="52" rx="12" fill="#FFFFFF" />
    <circle cx="300" cy="171" r="10" fill="#FFD166" />
    <text x="300" y="175" font-family="sans-serif" font-size="11" text-anchor="middle">📢</text>
    <text x="317" y="167" font-family="sans-serif" font-weight="700" font-size="9" fill="#1F2937">Notice</text>
    <text x="317" y="179" font-family="sans-serif" font-size="8" fill="#6B7280">Water tank</text>
  </g>
</svg>