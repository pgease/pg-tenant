<svg width="400" height="320" viewBox="0 0 400 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle / Glow -->
  <circle cx="200" cy="160" r="130" fill="#E6F3F3" />

  <!-- Center Payment Card -->
  <g filter="drop-shadow(0px 12px 24px rgba(0,0,0,0.1))">
    <rect x="110" y="60" width="180" height="200" rx="20" fill="#FFFFFF" />
    <!-- Brand Stripe -->
    <rect x="110" y="60" width="180" height="8" rx="4" fill="#008080" />
    
    <!-- Receipt Icon -->
    <circle cx="200" cy="105" r="24" fill="#E6F3F3" />
    <path d="M192 105L197 110L208 99" stroke="#008080" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="200" y="145" font-family="sans-serif" font-weight="800" font-size="16" fill="#1F2937" text-anchor="middle">₹ 8,500</text>
    <text x="200" y="160" font-family="sans-serif" font-weight="600" font-size="10" fill="#059669" text-anchor="middle">Rent Paid Successfully</text>

    <!-- Divider Line -->
    <line x1="130" y1="175" x2="270" y2="175" stroke="#E5E7EB" stroke-dasharray="4 4" stroke-width="1.5"/>

    <!-- Receipt Meta -->
    <text x="135" y="196" font-family="sans-serif" font-size="8" fill="#6B7280">UTR: 3290481289</text>
    <rect x="135" y="208" width="130" height="26" rx="6" fill="#008080" />
    <text x="200" y="225" font-family="sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle">Instant Official Receipt ✓</text>
  </g>

  <!-- Floating UPI Badges Left & Right -->
  <g filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.12))">
    <rect x="30" y="125" width="70" height="50" rx="12" fill="#FFFFFF" />
    <text x="65" y="147" font-family="sans-serif" font-weight="800" font-size="12" fill="#008080" text-anchor="middle">UPI</text>
    <text x="65" y="162" font-family="sans-serif" font-size="7" fill="#6B7280" text-anchor="middle">Pay Online</text>
  </g>

  <g filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.12))">
    <rect x="300" y="125" width="70" height="50" rx="12" fill="#FFFFFF" />
    <circle cx="335" cy="144" r="8" fill="#FFD166" />
    <text x="335" y="148" font-family="sans-serif" font-size="9" text-anchor="middle">⚡</text>
    <text x="335" y="164" font-family="sans-serif" font-size="7" fill="#1F2937" text-anchor="middle">Auto-Sync</text>
  </g>
</svg>